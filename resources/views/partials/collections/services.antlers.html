<!-- wc-column -->
<div class="wc-column load-more-item" data-index="{{ index }}">
    <div class="wc-services-img img-cover">
        <img src="{{ featured_image:url }}" alt="{{ featured_image:alt }}">
    </div>
    <div class="wc-services-detail">
        <h2 class="service-number"></h2>
        <h5>
            <a href="{{ url }}" target="_blank">{{ title }}</a>
        </h5>
    </div>
</div>
