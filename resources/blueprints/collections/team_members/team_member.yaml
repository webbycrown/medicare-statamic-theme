title: 'Team Member'
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
              display: 'Doctor Name'
          -
            handle: image
            field:
              max_files: 1
              container: assets
              type: assets
              display: Image
          -
            handle: specialties
            field:
              mode: select
              collections:
                - specialtzation
              type: entries
              display: Specialties
      -
        display: Details
        fields:
          -
            import: all_page_builder
          -
            handle: experience_title
            field:
              type: text
              display: Experience
          -
            handle: skill_information
            field:
              type: textarea
              display: 'Skill information'
          -
            handle: award_title
            field:
              type: text
              display: 'Award title'
          -
            handle: award_images
            field:
              container: assets
              type: assets
              display: 'Award Images'
          -
            handle: personal_information
            field:
              type: grid
              display: 'Personal Information'
              fields:
                -
                  handle: title
                  field:
                    type: text
                    display: Title
                -
                  handle: information
                  field:
                    type: text
                    display: Information
          -
            handle: progress_bar
            field:
              type: grid
              display: 'Progress Bar'
              fields:
                -
                  handle: title
                  field:
                    type: text
                    display: Title
                -
                  handle: value
                  field:
                    type: text
                    display: Value
                    instructions: 'between 0 to 100'
      -
        display: Timing
        fields:
          -
            handle: section_title
            field:
              type: text
              display: 'Section Title'
          -
            handle: section_heading
            field:
              type: text
              display: 'Section Heading'
          -
            handle: description
            field:
              type: textarea
              display: Description
          -
            handle: time_details
            field:
              type: grid
              display: 'Time Details'
              fields:
                -
                  handle: day
                  field:
                    type: text
                    display: Day
                -
                  handle: time
                  field:
                    type: text
                    display: Time
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
