tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: name
            field:
              placeholder: Name
              type: text
              display: Name
              validate:
                - required
          -
            handle: comment_email
            field:
              placeholder: Email
              type: text
              display: 'Comment Email'
              validate:
                - required
                - email
          -
            handle: website
            field:
              placeholder: Website
              type: text
              display: Website
          -
            handle: additional_information
            field:
              placeholder: 'Additional Information'
              type: textarea
              display: 'Additional Information'
              validate:
                - required
          -
            handle: parent_id
            field:
              type: text
              display: 'Parent Id'
          -
            handle: blog_id
            field:
              type: text
              display: 'Blog Id'
