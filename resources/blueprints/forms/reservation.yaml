tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: name
            field:
              placeholder: Name
              type: text
              display: Name
              validate:
                - required
          -
            handle: reason_for_appointment
            field:
              placeholder: 'reason for appointment'
              type: text
              display: 'reason for appointment'
              validate:
                - required
                - email
